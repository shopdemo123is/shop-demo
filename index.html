<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>店铺名称</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            background-color: #f5f7fa;
            padding-bottom: 80px;
        }
        /* 顶部导航 */
        .top-nav {
            background: linear-gradient(to right, #667eea, #764ba2);
            color: white;
            padding: 10px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .nav-links a {
            color: white;
            text-decoration: none;
            margin-right: 15px;
            font-size: 13px;
        }
        .search-btn {
            background: white;
            color: #667eea;
            border: none;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 13px;
        }
        /* 店铺信息区 */
        .shop-header {
            background: linear-gradient(to bottom, #e0f7ff, #ffffff);
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .shop-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #667eea;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 20px;
        }
        .shop-info h1 {
            font-size: 18px;
            color: #333;
        }
        .shop-info .verified {
            color: #667eea;
            font-size: 12px;
        }
        .shop-info .meta {
            margin-top:5px; 
            font-size:12px; 
            color:#666;
        }
        .shop-info .meta a {
            color:#667eea; 
            text-decoration:none;
            margin-right:8px;
        }
        /* 快捷服务栏 */
        .service-bar {
            display: flex;
            justify-content: space-around;
            background: white;
            padding: 10px 0;
            margin: 10px 0;
        }
        .service-item {
            text-align: center;
        }
        .service-item span {
            display: block;
            font-size: 14px;
            color: #333;
        }
        .service-item small {
            font-size: 12px;
            color: #999;
        }
        /* 分类标签 */
        .category-tabs {
            display: flex;
            overflow-x: auto;
            background: white;
            padding: 10px;
            gap: 10px;
        }
        .tab {
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 13px;
            white-space: nowrap;
            background: #f0f0f0;
        }
        .tab.active {
            background: #667eea;
            color: white;
        }
        /* 商品列表（空模板） */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            padding: 10px;
            min-height: 300px; /* 占位高度 */
        }
        .empty-tip {
            grid-column: 1 / -1;
            text-align: center;
            padding: 80px 20px;
            color: #999;
            font-size: 14px;
        }
        /* 底部留白 */
        footer {
            text-align: center;
            padding: 20px;
            font-size: 12px;
            color: #999;
        }
    </style>
</head>
<body>
    <!-- 顶部导航 -->
    <div class="top-nav">
        <div class="nav-links">
            <a href="#">网站首页</a>
            <a href="#">订单查询</a>
            <a href="#">禁售目录</a>
            <a href="#">常见问题</a>
            <a href="#">关于我们</a>
        </div>
        <button class="search-btn">订单查询</button>
    </div>

    <!-- 店铺信息 -->
    <div class="shop-header">
        <div class="shop-avatar">店</div>
        <div class="shop-info">
            <h1>你的店铺名称</h1>
            <span class="verified">✅ 已认证</span>
            <div class="meta">
                <a href="#">联系TA</a>
                <a href="#">分享</a>
                <a href="#">快手</a>
            </div>
        </div>
    </div>

    <!-- 快捷服务 -->
    <div class="service-bar">
        <div class="service-item">
            <span>数字卡密</span>
            <small>0件商品</small>
        </div>
        <div class="service-item">
            <span>知识文章</span>
            <small>0件商品</small>
        </div>
        <div class="service-item">
            <span>资源下载</span>
            <small>0件商品</small>
        </div>
    </div>

    <!-- 分类标签 -->
    <div class="category-tabs">
        <div class="tab active">全部 共0件商品</div>
        <div class="tab">分类一</div>
        <div class="tab">分类二</div>
        <div class="tab">分类三</div>
    </div>

    <!-- 商品列表（空模板，后台添加后自动替换） -->
    <div class="product-grid">
        <div class="empty-tip">
            暂无商品，后台添加后即可显示
        </div>
    </div>

    <footer>
        © 2026 你的店铺名称 版权所有
    </footer>
</body><!-- trigger deploy -->

</html>
